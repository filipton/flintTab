[package]
name = "tabdisplay-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
md5 = "0.7"
vdisplay-ffi = { path = "../vdisplay-ffi" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc = "0.2"
screencapturekit = { version = "1.5.0", features = ["macos_26_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
x11rb = { version = "0.13", features = ["xtest"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
# objc 0.2's msg_send! checks `feature = "cargo-clippy"` inside the calling crate
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
