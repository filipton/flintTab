[package]
name = "tabdisplay-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
vdisplay-ffi = { path = "../vdisplay-ffi" }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5.0", features = ["macos_26_0"] }
