name: Host

on:
  push:
    paths: ["host/**", "vdisplay-ffi/**", "Cargo.toml", "Cargo.lock", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", "vdisplay-ffi/**", "Cargo.toml", "Cargo.lock", ".github/workflows/host.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ScreenCaptureKit's bindings use the macOS 26 SDK (Xcode 26).
          - { os: macos-26, name: macos-arm64 }
          # Oldest glibc we support (Ubuntu 22.04, Debian 12, Fedora 36 and newer).
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GStreamer headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo build --release -p tabdisplay-host
      - run: cargo test --release -p tabdisplay-host
      - run: tar czf tabdisplay-host-${{ matrix.name }}.tar.gz -C target/release tabdisplay-host
      - uses: actions/upload-artifact@v4
        with:
          name: tabdisplay-host-${{ matrix.name }}
          path: tabdisplay-host-${{ matrix.name }}.tar.gz

  # Ready-made binaries: no Rust, Xcode or -dev packages needed to run the host.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view host-latest >/dev/null 2>&1 || gh release create host-latest --prerelease --target "$GITHUB_SHA" \
            --title "Host (latest)" --notes "Built from main. Unpack and run tabdisplay-host; see the README."
          gh release upload host-latest tabdisplay-host-*.tar.gz --clobber
